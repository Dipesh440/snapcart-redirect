<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · SnapCart</title>
    <style>
        /* === CSS Variables — single source of truth for the design === */
        :root {
            --color-brand: #F59E0B;        /* Amber-500 — warm, approachable */
            --color-brand-hover: #D97706;  /* Amber-600 */
            --color-surface: #FFFFFF;
            --color-bg: #FFFBEB;           /* Amber-50 — soft warm tint */
            --color-text: #1E293B;         /* Slate-800 — readable, not pure black */
            --color-text-muted: #64748B;   /* Slate-500 */
            --color-border: #FDE68A;       /* Amber-200 — subtle definition */
            --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.08);
            --radius-card: 20px;
            --radius-button: 12px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* === Reset & Base === */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--color-bg);
            /* Subtle radial glow instead of harsh gradient */
            background-image: radial-gradient(ellipse at 50% 0%, #FDE68A33 0%, transparent 60%);
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* === Card — soft elevation, breathing room === */
        .card {
            background: var(--color-surface);
            padding: 40px 32px 36px;
            border-radius: var(--radius-card);
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--color-border);
            /* Micro-animation on entry */
            animation: cardEnter 0.5s ease-out;
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === Icon — visual anchor at the top === */
        .card-icon {
            width: 56px;
            height: 56px;
            background: #FEF3C7;           /* Amber-100 */
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .card-icon svg {
            width: 28px;
            height: 28px;
            color: var(--color-brand);
        }

        /* === Typography — clear hierarchy === */
        .card h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .card p {
            font-size: 15px;
            color: var(--color-text-muted);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* === Button — generous touch target, clear affordance === */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--color-brand);
            color: #1E293B;                /* Dark text on yellow for contrast */
            border: none;
            padding: 14px 24px;
            border-radius: var(--radius-button);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }

        .btn:hover {
            background: var(--color-brand-hover);
            box-shadow: 0 2px 8px rgba(217,119,6,0.25);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:focus-visible {
            outline: 3px solid #F59E0B;
            outline-offset: 2px;
        }

        /* === Divider — visual separator === */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--color-text-muted);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E2E8F0;
        }

        /* === Status message — for the auto-redirect feedback === */
        .status {
            font-size: 13px;
            color: var(--color-text-muted);
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22C55E;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* === Footer note === */
        .footnote {
            margin-top: 20px;
            font-size: 12px;
            color: #94A3B8;
        }

        /* === Reduced motion — respect user preference === */
        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; }
            .status-dot { animation: none; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Lock icon — instantly communicates "security/authentication" -->
        <div class="card-icon" aria-hidden="true">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
        </div>

        <h2>Reset your password</h2>
        <p>Tap the button below to open SnapCart and create a new password.</p>

        <button class="btn" onclick="openApp()" id="ctaButton">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                <line x1="12" y1="18" x2="12.01" y2="18"/>
            </svg>
            Open SnapCart App
        </button>

        <div class="status" id="statusMessage" style="display: none;">
            <span class="status-dot"></span>
            Redirecting you now...
        </div>

        <p class="footnote">Didn't work? Make sure SnapCart is installed.</p>
    </div>

    <script>
        function openApp() {
            const params = new URLSearchParams(window.location.search);
            const oobCode = params.get('oobCode');

            // Show feedback to user
            const statusEl = document.getElementById('statusMessage');
            statusEl.style.display = 'flex';

            // Small delay so user sees the feedback
            setTimeout(() => {
                window.location = `snapcart://resetpassword?oobCode=${oobCode}`;
            }, 400);
        }

        // Auto-redirect after 1.5s (slightly longer — feels less jarring)
        window.onload = function() {
            setTimeout(openApp, 1500);
        }
    </script>
</body>
</html>
